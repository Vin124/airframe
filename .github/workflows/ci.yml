name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    # The project targets Windows (Windows Graphics Capture, ctypes
    # EnumWindows, OBS virtual cam), so tests run on a Windows runner. The
    # suite itself is headless: no webcam, display, mic, or network needed.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest -q
